<noscript><main class="shell" style="padding-block:48px"><h1>The Intrinsic Review</h1><p style="margin-top:24px">Independent finance education. This reading experience needs JavaScript to open its sections and teaching tools.</p><p style="margin-top:24px">For general education only. No personal recommendations or trading calls.</p></main></noscript>
<script>
window.LEDGER_CONTENT={meta:{publicationName:"The Intrinsic Review",authorName:"[Author name]",dateLabel:"Illustrative editorial revision",sourceAccessed:"23 October 2026",educationNotice:"For education and general information only. No personal investment recommendations, buy or sell calls, ratings or target prices. Investments can lose value; examples do not establish what is suitable for an individual.",exampleNotice:"All named example companies and funds are fictional. Illustrative numbers explain a method; they are not forecasts, real investment results or recommended allocations.",editorialPromise:"Understand the mechanism. Inspect the assumptions. Keep the uncertainty in view."},sections:[{id:"home",label:"Home",path:"/",title:"Understanding comes first.",description:"Independent education on investing, portfolios, markets and company research."},{id:"start-here",label:"Start Here",path:"/start-here",title:"A clear place to begin.",description:"Eight connected lessons. Build the vocabulary, then put the ideas to work."},{id:"learn",label:"Learn",path:"/learn",title:"Build your understanding.",description:"Plain-English lessons and practical reading guides, with room for questions."},{id:"investing",label:"Investing",path:"/investing",title:"The decisions behind the numbers.",description:"Explore time, costs and the assumptions that shape an investment illustration."},{id:"portfolio",label:"Portfolio",path:"/portfolio",title:"Look at the whole collection.",description:"Understand concentration, overlap and how different holdings fit together."},{id:"research",label:"Research",path:"/research",title:"The method is part of the story.",description:"Worked educational notes with visible sources, assumptions and limitations."},{id:"markets",label:"Markets",path:"/markets",title:"Context before conclusions.",description:"Separate what changed from the explanations offered for it."},{id:"about",label:"About",path:"/about",title:"An open notebook.",description:"A publication by [Author name], built around careful explanation and independent learning."}],course:{id:"investing-foundations",title:"Investing, from the beginning",dek:"An eight-lesson path from basic vocabulary to the mechanisms behind a portfolio. No prior financial knowledge required.",lessonIds:["investing-basics","shares","bonds","etfs","funds","risk-and-return","diversification","compounding"],completionMessage:"You have worked through the foundations. Revisit any idea, then use the research notes to practise asking more precise questions."},lessons:[{id:"investing-basics",title:"What does investing actually mean?",dek:"Start with what you own, how it might produce a return and what could change its value.",section:"learn",type:"lesson",order:1,minutes:3,date:"2026-10-23",tags:["basics","risk"],related:["shares","risk-and-return","investment-time-horizon"],keyTakeaway:"Understand the asset, the route used to hold it and the uncertainty involved before interpreting a return.",sections:[{id:"what-you-own",title:"Begin with the thing itself",paragraphs:["Investing means committing money to an asset with an uncertain future outcome. The possible return may include income, a change in value, or both. That outcome can be negative.","A share is an ownership interest in a company. A bond is a debt instrument. A fund pools investors\u2019 money under a stated investment approach. These are different arrangements, even if an app displays all of them in a similar list."]},{id:"three-layers",title:"Separate three layers",paragraphs:["The underlying asset, the investment vehicle and the account are separate layers. A fund may hold shares; an account may hold units in that fund. Reading the account\u2019s name does not tell you everything about the investments inside it.","Imagine an unlabelled box containing several smaller boxes. Counting the boxes is less useful than finding out what each contains. The same habit helps when unfamiliar financial names begin to accumulate."],bullets:["Asset: what creates the economic exposure?","Vehicle: how are those assets collected or held?","Account: through what arrangement is the investment owned?"]},{id:"first-questions",title:"Leave with better questions",paragraphs:["For any unfamiliar investment, practise explaining how money could be earned or lost, how it can be accessed and what charges apply. An answer that depends entirely on somebody paying more later deserves further examination.","You do not need to form an opinion immediately. Being able to state what remains unclear is already progress. The next lessons introduce ownership, lending and pooled investing one at a time."],keyIdea:"A product name is the beginning of the explanation, not the explanation itself."}],sources:[{label:"MoneyHelper \u2014 A beginner\u2019s guide to investing",url:"https://www.moneyhelper.org.uk/en/savings/investing/investing-beginners-guide",accessed:"23 October 2026"}]},{id:"shares",title:"A share is part of a business",dek:"Connect the quoted price to the ownership interest it represents.",section:"learn",type:"lesson",order:2,minutes:3,date:"2026-10-23",tags:["basics","shares","company-research"],related:["bonds","profit-cash","reading-a-market-story"],keyTakeaway:"A share price describes a market exchange; understanding the business requires a different set of questions.",sections:[{id:"ownership",title:"What the share represents",paragraphs:["A share represents an ownership interest in a company. The rights attached to it depend on the type of share and the company\u2019s arrangements. Owning shares is different from lending to the company.","For a deliberately simplified example, imagine fictional North Quay Tools has 1,000 identical shares. Ten of those shares represent 1% of that share class. The example explains a fraction; it says nothing about the business\u2019s value or any price worth paying."]},{id:"return",title:"Where a return can come from",paragraphs:["A shareholder may receive dividends and may experience a gain or loss as the share price changes. Dividends are not assured. A business can retain profits, change its distributions or encounter losses.","The quoted price is the price at which the market is valuing a share at that time. It does not tell you how much cash the business holds, how much it owes or whether its accounts support the story being told about it."],note:"A company\u2019s share price and its total market value are different quantities. The number of shares matters when moving between them."},{id:"business-questions",title:"Read beyond the price",paragraphs:["A useful first research pass asks what the company sells, who pays it and which costs must be met. Then ask how profits connect to cash and what could disrupt that process.","This approach does not produce a recommendation. It creates a clearer description of the object being studied. A well-described business can still be an uncertain investment, and a low-looking share price does not establish that it is inexpensive."],keyIdea:"Learn to describe the business before trying to interpret its valuation."}],sources:[{label:"MoneyHelper \u2014 Thinking about investing? Make sure you understand the risks (shares as ownership stakes; asset classes)",url:"https://www.moneyhelper.org.uk/en/savings/investing/thinking-about-investing-make-sure-you-understand-the-risks",accessed:"23 October 2026"}]},{id:"bonds",title:"A bond begins with a promise",dek:"Separate the promised payments from the price paid and the risks of receiving them.",section:"learn",type:"lesson",order:3,minutes:3,date:"2026-10-23",tags:["basics","bonds","risk"],related:["etfs","risk-and-return","investment-time-horizon"],keyTakeaway:"A contractual payment schedule does not make a bond\u2019s price or repayment certain.",sections:[{id:"lending",title:"An investor lends to an issuer",paragraphs:["A bond is a debt instrument issued by a borrower, such as a government or company. Its terms describe the payments the issuer promises and when repayment is due. Different bonds can have very different terms.","A plain fixed-coupon bond has a stated interest payment and a maturity date. Other structures exist, so the word \u2018bond\u2019 alone is not a complete description. The issuer\u2019s ability to meet its obligations remains relevant."]},{id:"coupon-price-yield",title:"Coupon, price and yield are different",paragraphs:["In a fictional example, a bond with \xA3100 face value promises \xA34 of interest each year. Its coupon is 4% of face value. If the market price were \xA380, that \xA34 would be 5% of the purchase price.","That 5% calculation is a simple current-income measure. It is not the full return to maturity: repayment, timing, default and other terms would also matter. The example uses invented figures solely to distinguish the measures."],note:"A quoted yield needs a definition. Two numbers labelled \u2018yield\u2019 may describe different calculations."},{id:"bond-risks",title:"The promise and the price can change",paragraphs:["An issuer may fail to pay. A bond\u2019s market price can also change as required yields change. For a conventional fixed-rate bond, a higher required yield generally means a lower price, other things equal.","Selling before maturity introduces the price available at that time. Holding to maturity does not remove default risk or the effect of inflation on what the payments can buy. Studying those distinct risks is more useful than treating all bonds as one category."]}],sources:[{label:"UK Debt Management Office \u2014 About gilts (coupons, prices and yields on UK government bonds)",url:"https://www.dmo.gov.uk/responsibilities/gilt-market/about-gilts/",accessed:"23 October 2026"}]},{id:"etfs",title:"An ETF is a structure, not a strategy",dek:"Exchange trading explains how a fund is accessed. Its holdings explain what it does.",section:"learn",type:"lesson",order:4,minutes:3,date:"2026-10-23",tags:["basics","etfs","funds"],related:["funds","reading-a-fund-factsheet","portfolio-overlap"],keyTakeaway:"Two ETFs can share an exchange-traded structure while carrying very different exposures and risks.",sections:[{id:"structure",title:"What exchange trading tells you",paragraphs:["An exchange-traded fund is a pooled investment whose shares trade on an exchange. The fund has an objective and holdings or exposures used to pursue it. Its market trading price is a separate observation from the value calculated for the underlying portfolio.","Some ETFs follow an index; others use an active approach. The label does not mean that every ETF is broad, simple or low risk. Start with the actual objective rather than the abbreviation."]},{id:"contents",title:"Look inside the container",paragraphs:["For a fictional comparison, imagine one ETF holding a broad collection of shares and another concentrating on a single narrow industry. Both can appear under the same \u2018ETF\u2019 filter while responding to very different influences.","The comparison becomes clearer when you list the investment universe, concentration, costs and method used to obtain exposure. A familiar fund name cannot substitute for those details."],bullets:["What is the fund trying to track or achieve?","What does it hold, and how concentrated is it?","What costs and trading frictions need to be understood?","Which risks are left after looking through the label?"]},{id:"price-and-cost",title:"Separate the layers of cost",paragraphs:["An ongoing fund charge and the cost of buying or selling are different layers. The market\u2019s buy and sell prices may differ, and an account provider may apply its own charges.","A useful educational comparison states which layers are included instead of declaring one headline percentage to be the entire cost. The next lesson broadens the view to pooled funds and their operating choices."],keyIdea:"Read the strategy and the structure together."}],sources:[{label:"FCA InvestSmart \u2014 Advantages of mainstream investments (funds that invest in the stock market)",url:"https://www.fca.org.uk/investsmart/advantages-mainstream-investments",accessed:"23 October 2026"}]},{id:"funds",title:"What happens inside a fund?",dek:"A pooled investment has a mandate, a portfolio and a set of operating choices.",section:"learn",type:"lesson",order:5,minutes:3,date:"2026-10-23",tags:["basics","funds","fees"],related:["risk-and-return","reading-a-fund-factsheet","fund-fees"],keyTakeaway:"The fund\u2019s objective and implementation matter more than its name or a single historical return.",sections:[{id:"pool",title:"Many investors, one mandate",paragraphs:["A fund pools money and follows an investment mandate. That mandate describes its intended approach: what it may hold, what it is trying to achieve and the constraints it operates within.","The collective structure can make it possible to access a portfolio through one holding. It does not guarantee broad diversification. A fund can be tightly concentrated, and several funds can repeat the same underlying exposure."]},{id:"approach",title:"Understand how the portfolio is built",paragraphs:["An index-following approach seeks to reproduce a defined index\u2019s performance, subject to implementation and costs. An active approach makes portfolio decisions in pursuit of its stated objective. Either description still leaves questions about the actual holdings and risks.","Imagine fictional Harbour Broad Fund and Harbour Focus Fund. Their names suggest different intentions, but a researcher would need their mandates and holdings to test that impression. Neither fictional fund is offered as an investment choice."],note:"A benchmark is a reference for comparison. Check whether its universe and return measure make the comparison meaningful."},{id:"documents",title:"Use documents as a connected set",paragraphs:["A factsheet is a summary. The fuller fund documents explain matters that may not fit on that page. Read the exact share class, date, charges and objective before comparing a performance figure.","Different classes of the same fund can have different terms. When two pages appear to disagree, first check that they describe the same class and reporting period. The discipline is identification before interpretation."],keyIdea:"One holding can contain a complex collection. The label is only a starting point."}],sources:[{label:"MoneyHelper \u2014 Types of investments",url:"https://www.moneyhelper.org.uk/en/savings/investing/popular-investments-at-a-glance",accessed:"23 October 2026"},{label:"MoneyHelper \u2014 A beginner\u2019s guide to investing (pooled funds such as unit trusts, OEICs and investment trusts)",url:"https://www.moneyhelper.org.uk/en/savings/investing/investing-beginners-guide",accessed:"23 October 2026"}]},{id:"risk-and-return",title:"Risk is more than a moving line",dek:"Name the uncertainty before trying to measure or compare it.",section:"learn",type:"lesson",order:6,minutes:3,date:"2026-10-23",tags:["basics","risk","time-horizon"],related:["diversification","investment-time-horizon","reading-a-market-story"],keyTakeaway:"A higher possible return is not a guarantee of a better outcome, and price volatility is only one form of risk.",sections:[{id:"name-risk",title:"Ask what could go wrong",paragraphs:["Risk is not a single label that explains every possible disappointment. Prices can fall, an issuer can fail to pay, an investment can be difficult to sell, or money can lose purchasing power.","Those mechanisms call for different questions. A smooth price history would not, on its own, establish that an investment is easy to exit. A promised payment schedule would not prove that the payer can meet it."]},{id:"return",title:"Distinguish possible from realised",paragraphs:["Investors may seek compensation for bearing uncertainty. That does not ensure the hoped-for return arrives. Greater risk can lead to a worse result rather than a better one.","Volatility describes variation in a measured price or return series. It can be useful, but its meaning depends on the data period and frequency. It does not capture every way an investment could fail to meet a need."],note:"A past return is an observation. An expected return is an assumption. A guaranteed payment would require an identified promise and an assessment of who stands behind it."},{id:"context",title:"Put the measure beside the purpose",paragraphs:["The same temporary price fall can have different practical consequences depending on when money must be accessed. That is why an investment description and a person\u2019s circumstances are separate parts of the problem.","For this course, the aim is to recognise the language: price risk, credit risk, liquidity risk and inflation risk. Naming the mechanism makes a later explanation more useful than calling something simply \u2018safe\u2019 or \u2018risky\u2019."],bullets:["What uncertainty is being described?","Over what period is it measured?","Which important risks are not included in the measure?"]}],sources:[{label:"FCA \u2014 Risk and returns",url:"https://www.fca.org.uk/investsmart/risk-returns",accessed:"23 October 2026"},{label:"Bank of England \u2014 What is inflation?",url:"https://www.bankofengland.co.uk/explainers/what-is-inflation",accessed:"23 October 2026"}]},{id:"diversification",title:"Different names can share one risk",dek:"Look through the holdings to the exposures they have in common.",section:"learn",type:"lesson",order:7,minutes:3,date:"2026-10-23",tags:["basics","diversification","portfolio"],related:["compounding","portfolio-overlap","portfolio-review-questions"],keyTakeaway:"Diversification is about how exposures are spread, not just how many holdings appear on a screen.",sections:[{id:"collection",title:"Count what matters",paragraphs:["A portfolio can contain several holdings and still depend heavily on one underlying business or economic force. Two funds may own some of the same shares. Different companies may depend on similar customers or financing conditions.","Diversification seeks to reduce dependence on a narrow set of outcomes. It can operate across assets and within an asset category, but it cannot guarantee that a portfolio will avoid losses."]},{id:"look-through",title:"Look through each layer",paragraphs:["Take fictional Fund A and fictional Fund B. If both own a company, owning both funds adds those exposures together. The combined exposure depends on each fund\u2019s portfolio weight and the company\u2019s weight inside it.","The exercise is a map, not a score. Its value is to reveal a concentration that a list of fund names conceals. The research note on portfolio overlap works through this arithmetic with fully invented holdings."],bullets:["Direct exposure: what is held outright?","Indirect exposure: what is held inside funds?","Shared drivers: what could affect several holdings together?","Uncertainty: which holdings or reporting dates are missing?"]},{id:"limits",title:"A snapshot is not a guarantee",paragraphs:["Holdings change, and relationships between investments can change too. A snapshot may explain current overlap without predicting how different assets will behave in a future event.","There is no universal holding count that makes a collection safe. A useful explanation states what is diversified, what remains concentrated and what evidence supports that description. It does not need to turn that analysis into an allocation recommendation."]}],sources:[{label:"FCA \u2014 Diversification",url:"https://www.fca.org.uk/investsmart/diversification",accessed:"23 October 2026"}]},{id:"compounding",title:"Time changes the arithmetic",dek:"Follow a balance from one period into the next, including the effect of deductions.",section:"learn",type:"lesson",order:8,minutes:3,date:"2026-10-23",tags:["basics","compounding","fees"],related:["fund-fees","investment-time-horizon","profit-cash"],keyTakeaway:"Compounding repeats a calculation on a changing base. It can magnify deductions and losses as well as growth.",sections:[{id:"repeated-base",title:"Each period starts with a new base",paragraphs:["In an invented example, \xA31,000 grows by a fixed 5% to \xA31,050 in one year. Applying the same rate again produces \xA31,102.50. The second year\u2019s \xA352.50 increase is calculated on \xA31,050, not on the original \xA31,000.","The example isolates the arithmetic. It is not a statement about a return that can be earned. The constant rate is an assumption chosen to make the repetition easy to inspect."]},{id:"deductions",title:"A deduction changes later periods",paragraphs:["If a percentage fee is taken after each year\u2019s growth, the next year begins with less money. A comparison between paths with and without that fee therefore includes both the deductions and the later compounding affected by them.","That difference is an ending-value gap. Calling it \u2018fees paid\u2019 would combine two different quantities. The fee research note makes the timing assumption explicit and shows the formula."]},{id:"not-always-growth",title:"Repetition does not promise growth",paragraphs:["Compounding also describes losses. In another fictional example, \xA31,000 falls by 20% to \xA3800. A later 20% rise takes \xA3800 to \xA3960, not back to \xA31,000. Equal positive and negative percentages act on different bases.","Real investment paths can vary from period to period, and cash contributions or withdrawals add further detail. You have reached the end of the foundation course; the next step is to inspect how these ideas are used in an actual explanation, rather than memorising a smooth curve."],keyIdea:"A clear model states its starting amount, timing, deductions and assumptions."}],sources:[{label:"MoneyHelper \u2014 Interest rates explained (how compound interest works)",url:"https://www.moneyhelper.org.uk/en/savings/how-to-save/interest-rates-explained",accessed:"23 October 2026"},{label:"MoneyHelper \u2014 Key information and cooling off periods (where charges appear in KIID/KID documents)",url:"https://www.moneyhelper.org.uk/en/savings/investing/key-facts-documents-and-cooling-off-periods-what-you-need-to-know",accessed:"23 October 2026"}]}],articles:[{id:"isas-explained",title:"What an ISA is, and what it is not",dek:"An ISA is an account wrapper with a yearly allowance. What sits inside it is a separate question.",section:"learn",type:"article",ukEssential:!0,minutes:4,date:"2026-10-23",tags:["uk-accounts","basics"],related:["lifetime-isa-explained","fscs-protection-explained","investing-basics"],keyTakeaway:"An ISA changes how returns are taxed. It does not change what the investments inside it are, or how much risk they carry.",sections:[{id:"wrapper",title:"A wrapper, not an investment",paragraphs:["An Individual Savings Account (ISA) is a UK account type. Interest, dividends and gains on what is held inside it are not subject to UK Income Tax or Capital Gains Tax. The account itself is not an investment; it is the arrangement through which cash or investments are held.","This follows the three layers from lesson 1. A stocks and shares ISA is the account. A fund held in it is the vehicle. The shares or bonds that fund owns are the underlying assets. Each layer needs its own questions."]},{id:"types",title:"Four types, one allowance",paragraphs:["GOV.UK lists four types of ISA: cash ISAs, stocks and shares ISAs, innovative finance ISAs and Lifetime ISAs. For the 2026 to 2027 tax year, GOV.UK gives the total amount that can be paid into ISAs as \xA320,000, shared across the types. Unused allowance does not carry over after 5 April.","The allowance measures what is paid in during the tax year, not the value of the account. MoneyHelper points out that a fall in value does not create room to top up within the same year. A change has been announced for cash ISAs. HMRC\u2019s tax information and impact note (published on GOV.UK in September 2026) says that from 6 April 2027 the yearly cash ISA limit will be \xA312,000 for people under 65, within the overall \xA320,000 ISA allowance, and will stay at \xA320,000 for people aged 65 or over. The note says the ISA Regulations will be amended to make this change. Limits and rules can change, so check the current figures on GOV.UK."],bullets:["Who can open one: GOV.UK says you must be 18 or over and UK resident (or a Crown servant or in the armed forces, or their spouse or civil partner).","Transfers: moving an ISA to another provider through a transfer keeps the tax treatment; withdrawing and paying in again uses allowance.","Flexibility: some providers let you replace withdrawals in the same tax year. Not all do."]},{id:"what-it-does-not-do",title:"What the wrapper does not change",paragraphs:["A stocks and shares ISA can fall in value. The tax treatment does not reduce investment risk, charges or the effect of time. MoneyHelper notes that charges for the wrapper and the range of investments available differ between providers.","Protection is also a separate question. Whether the Financial Services Compensation Scheme (FSCS) could help if a provider failed depends on the type of firm and activity, not on the ISA label. See the FSCS guide in this series."],keyIdea:"Read the label as \u2018how it is taxed\u2019, then ask separately what is inside and what it costs."}],sources:[{label:"GOV.UK \u2014 Individual Savings Accounts (ISAs): overview and 2026 to 2027 allowance",url:"https://www.gov.uk/individual-savings-accounts",accessed:"23 October 2026"},{label:"GOV.UK (HMRC) \u2014 Cash ISA limit reduction: tax information and impact note (from 6 April 2027)",url:"https://www.gov.uk/government/publications/reduction-in-the-cash-individual-savings-account-isa-limit/cash-individual-savings-account-isa-limit-reduction",accessed:"23 October 2026"},{label:"MoneyHelper \u2014 Stocks and shares ISAs",url:"https://www.moneyhelper.org.uk/en/savings/investing/stocks-and-shares-isas",accessed:"23 October 2026"}]},{id:"lifetime-isa-explained",title:"The Lifetime ISA: a bonus with conditions",dek:"A government bonus, an age window and a withdrawal charge. Each part changes how the account behaves.",section:"learn",type:"article",ukEssential:!0,minutes:4,date:"2026-10-23",tags:["uk-accounts","time-horizon"],related:["isas-explained","pensions-and-sipps-explained","investment-time-horizon"],keyTakeaway:"A Lifetime ISA ties a bonus to two specific uses. Money taken out for anything else normally costs more than the bonus added.",sections:[{id:"mechanics",title:"How the mechanics work",paragraphs:["GOV.UK describes the Lifetime ISA (LISA) as a way to buy a first home or save for later life. You can pay in up to \xA34,000 each tax year until age 50, and the government adds a 25% bonus, up to \xA31,000 a year. GOV.UK says you must be 18 or over and under 40 to open one, and the first payment must be made before age 40.","The \xA34,000 counts towards the overall ISA allowance (\xA320,000 for 2026 to 2027, per GOV.UK). A LISA can hold cash, stocks and shares, or both, so the earlier point applies: the wrapper and its contents are separate questions. If it holds investments, their value can fall as well as rise, and you may get back less than you put in."]},{id:"uses",title:"The two intended uses",bullets:["A first home: MoneyHelper lists conditions including a purchase price of no more than \xA3450,000, a home you will live in, and a repayment mortgage.","Later life: withdrawals from age 60 are free of the withdrawal charge."],paragraphs:[],afterBullets:["GOV.UK also lists terminal illness as an exception to the withdrawal charge. These are the published conditions; a provider\u2019s own terms can add detail."]},{id:"charge",title:"Why the withdrawal charge matters",paragraphs:["Other withdrawals carry a 25% charge on the amount taken out. Because the charge applies to a pot that already includes the bonus, it takes back more than the bonus. GOV.UK\u2019s own worked example: \xA3800 of savings plus a \xA3200 bonus makes \xA31,000; withdrawing it all with the charge leaves \xA3750.","This is arithmetic, not a judgement about whether the account suits anyone. It shows why the time horizon and the likely use of the money are the first questions to ask."],keyIdea:"Check the conditions before the bonus. The bonus only works if the money is used as intended."}],sources:[{label:"GOV.UK \u2014 Lifetime ISA: overview",url:"https://www.gov.uk/lifetime-isa",accessed:"23 October 2026"},{label:"GOV.UK \u2014 Individual Savings Accounts: who can open an ISA (18 or over; under 40 for a Lifetime ISA)",url:"https://www.gov.uk/individual-savings-accounts",accessed:"23 October 2026"},{label:"GOV.UK \u2014 Lifetime ISA: withdrawing money (25% charge and worked example)",url:"https://www.gov.uk/lifetime-isa/withdrawing-money-from-your-lifetime-isa",accessed:"23 October 2026"},{label:"MoneyHelper \u2014 Lifetime ISAs",url:"https://www.moneyhelper.org.uk/en/savings/types-of-savings/a-guide-to-lifetime-isas",accessed:"23 October 2026"}]},{id:"pensions-and-sipps-explained",title:"Pensions and SIPPs: invested money with a later access date",dek:"Tax relief on the way in, a minimum age on the way out, and investment risk in between.",section:"learn",type:"article",ukEssential:!0,minutes:5,date:"2026-10-23",tags:["uk-accounts","time-horizon","fees"],related:["lifetime-isa-explained","fund-fees","investment-time-horizon"],keyTakeaway:"A defined contribution pension is usually invested. What it pays depends on contributions, investment performance, charges and how the money is taken.",sections:[{id:"what",title:"What a defined contribution pension is",paragraphs:["Most personal and many workplace pensions are defined contribution schemes. MoneyHelper explains that the amount such a pension provides depends on how much is paid in, how the invested money performs, the fees charged and how and when the money is taken. The value of the investments can fall as well as rise, and you may get back less than was paid in.","A self-invested personal pension (SIPP) is a type of personal pension that usually offers a wider choice of investments. MoneyHelper notes that most SIPP providers will choose investments by default unless you choose yourself, and that choosing your own can be complex."]},{id:"tax-relief",title:"Tax relief, in plain arithmetic",paragraphs:["GOV.UK explains that in \u2018relief at source\u2019 schemes, which include personal pensions, the provider claims basic-rate tax relief at 20% and adds it to the pot (20% is the basic rate of Income Tax for the 2026 to 2027 tax year, per GOV.UK). MoneyHelper\u2019s illustration: a \xA3100 contribution costs \xA380 from your own money. People paying higher rates of Income Tax may need to claim the rest themselves.","There are limits. GOV.UK describes tax relief on contributions worth up to 100% of annual earnings. HMRC\u2019s pension schemes rates on GOV.UK give an annual allowance of \xA360,000 for the 2026 to 2027 tax year; it can be lower for people with high incomes or who have already flexibly accessed a pension. These rules can change; check GOV.UK for current figures."]},{id:"access",title:"The access date shapes everything else",paragraphs:["MoneyHelper gives the usual earliest access age as 55, rising to 57 from April 2028, with exceptions such as ill health. GOV.UK says you can usually take up to 25% of a pension as a tax-free lump sum, capped at a total of \xA3268,275 across all your pensions (the \u2018lump sum allowance\u2019 for the 2026 to 2027 tax year). The long lock-in is why time horizon and charges matter so much in the pension context.","Workplace pensions often include employer contributions. MoneyHelper notes that, for employees, a workplace pension is usually better than opening a SIPP instead, because of those contributions and often lower charges. That is a general comparison, not a recommendation for any individual."],keyIdea:"Separate the tax treatment, the investments and the charges. Each one affects the outcome."}],sources:[{label:"MoneyHelper \u2014 SIPPs explained: self-invested personal pensions",url:"https://www.moneyhelper.org.uk/en/pensions-and-retirement/pensions-basics/self-invested-personal-pensions",accessed:"23 October 2026"},{label:"GOV.UK \u2014 Tax on your private pension contributions: tax relief",url:"https://www.gov.uk/tax-on-your-private-pension/pension-tax-relief",accessed:"23 October 2026"},{label:"GOV.UK (HMRC) \u2014 Pension schemes rates: annual allowance and lump sum allowance, 2026 to 2027",url:"https://www.gov.uk/government/publications/rates-and-allowances-pension-schemes/pension-schemes-rates",accessed:"23 October 2026"},{label:"GOV.UK \u2014 Tax on your private pension: lump sum allowance",url:"https://www.gov.uk/tax-on-your-private-pension/lump-sum-allowance",accessed:"23 October 2026"},{label:"GOV.UK \u2014 Income Tax rates and allowances (basic rate 20%, 2026 to 2027)",url:"https://www.gov.uk/income-tax-rates",accessed:"23 October 2026"},{label:"GOV.UK \u2014 Workplace pensions",url:"https://www.gov.uk/workplace-pensions",accessed:"23 October 2026"}]},{id:"fscs-protection-explained",title:"What FSCS protection covers, and what it does not",dek:"Compensation if an authorised firm fails is a different thing from protection against falling prices.",section:"learn",type:"article",ukEssential:!0,minutes:3,date:"2026-10-23",tags:["uk-accounts","risk"],related:["isas-explained","risk-and-return","pensions-and-sipps-explained"],keyTakeaway:"The FSCS can compensate eligible people when an authorised firm fails. It does not compensate for investments losing value.",sections:[{id:"what",title:"Two different risks",paragraphs:["The Financial Services Compensation Scheme (FSCS) is the UK\u2019s compensation scheme for customers of authorised financial firms. It can help if a firm fails and cannot pay what it owes. That is a different risk from market risk, where an investment simply falls in price.","MoneyHelper is direct about this: claims for poor investment performance are generally not covered. A fall in a fund\u2019s value is part of investing, not a firm failure."]},{id:"limits",title:"The headline limits",bullets:["Investments: up to \xA385,000 per eligible person, per firm, for firms that failed after 1 April 2019 (FSCS).","Deposits at banks, building societies and credit unions: up to \xA3120,000 per eligible person, per authorised institution, after the limit rose in December 2025 (FSCS)."],paragraphs:["Coverage depends on the firm being authorised by the FCA or PRA, and on the specific activity being a regulated one. The FSCS suggests asking a firm to confirm this. Some investment products are not protected at all."]},{id:"checks",title:"A practical reading check",paragraphs:["When a product mentions protection, ask which risk is being described. Is it the failure of the firm, or the value of the investment? The answer changes what the protection means."],bullets:["Is the firm authorised? The FCA Register shows this.","Is the activity regulated and FSCS protected?","Which limit applies: deposit or investment?","What would happen if the investment fell in value instead?"],keyIdea:"Protection against a firm failing is not protection against a price falling."}],sources:[{label:"FSCS \u2014 Investments: compensation limits and checks",url:"https://www.fscs.org.uk/what-we-cover/investments/",accessed:"23 October 2026"},{label:"FSCS \u2014 Banks, building societies and credit unions",url:"https://www.fscs.org.uk/what-we-cover/banks-building-societies-credit-unions/",accessed:"23 October 2026"},{label:"MoneyHelper \u2014 Thinking about investing? (FSCS and what it does not cover)",url:"https://www.moneyhelper.org.uk/en/savings/investing/thinking-about-investing-make-sure-you-understand-the-risks",accessed:"23 October 2026"}]},{id:"investment-time-horizon",title:"A time horizon is a question about need",dek:"The date beside the goal changes how a financial illustration should be read.",section:"investing",type:"article",minutes:4,date:"2026-10-23",tags:["time-horizon","risk","compounding"],related:["risk-and-return","compounding","fund-fees"],keyTakeaway:"A long horizon provides context for uncertainty. It does not turn an uncertain return into a promise.",sections:[{id:"need",title:"Start with what the date means",paragraphs:["A time horizon describes the period before money may be needed. That definition is more useful than treating a number of years as a property of an investment itself.","A purchase with a fixed payment date, a flexible future ambition and a series of withdrawals are different kinds of need. A single end date may not capture the whole pattern. This article explains that distinction without selecting an investment for any of them."]},{id:"periods",title:"Compare like periods",paragraphs:["A total return over several years and an annualised return are different descriptions. An annualised figure expresses an equivalent repeated rate; it does not mean every individual year produced that rate.","When reading an illustration, write down the starting date, end date and treatment of income. Then identify whether the number is a historical observation or a hypothetical assumption. Without those details, apparently comparable percentages may answer different questions."]},{id:"path",title:"The path can matter",paragraphs:["A final balance leaves out what happened in between. That omission becomes especially important when money is added or withdrawn during the period. The timing of those cash flows can affect the result experienced by the investor.","A fixed-rate calculator is useful for isolating a mechanism, but its smooth path is an assumption. Extending that path does not add evidence that the assumed return will occur."],keyIdea:"More years in a calculation do not make its inputs more certain."},{id:"reading-check",title:"A practical reading check",paragraphs:["Before accepting a time-based claim, separate the purpose, the calculation and the uncertainty. A statement can be mathematically correct while still being too incomplete to support a personal decision."],bullets:["What need or goal does the date represent?","Are contributions or withdrawals included?","Is the return total, annualised or a fixed model input?","What would change if access were needed sooner?","Which risks remain even over the stated period?"]}],sources:[{label:"MoneyHelper \u2014 A beginner\u2019s guide to investing (risk, time horizon and asset allocation)",url:"https://www.moneyhelper.org.uk/en/savings/investing/investing-beginners-guide",accessed:"23 October 2026"}]},{id:"reading-a-fund-factsheet",title:"Read a fund factsheet in the right order",dek:"Identify the object and the measurement before looking at the performance chart.",section:"learn",type:"article",minutes:4,date:"2026-10-23",tags:["funds","etfs","fees","evidence"],related:["funds","etfs","fund-fees"],keyTakeaway:"A factsheet becomes useful when its identity, objective, dates, costs and limitations are read together.",sections:[{id:"identity",title:"Confirm exactly what the page describes",paragraphs:["Start with the full fund name, share class and document date. Similar names can refer to different classes or products. A comparison can go wrong before any arithmetic begins if the objects are not the same.","Record the currency in which figures are shown and the period each table covers. A recently downloaded page is not necessarily a recently updated page. The document\u2019s own reporting date is the relevant starting point."]},{id:"mandate",title:"Read the objective before the result",paragraphs:["The objective and investment policy explain what the fund is trying to do. A benchmark may provide a comparison, but its meaning depends on whether it represents a relevant universe and uses a compatible return measure.","Turn the description into questions: what may the fund hold, how concentrated may it become, and what would count as an explanation for its performance? This creates a framework for the chart rather than letting the chart supply the whole story."]},{id:"measurement",title:"Check how the figures were made",paragraphs:["A price series and a return series including income are not interchangeable. Nor are returns before and after charges. When those details are missing from a summary, leave the comparison unresolved until the relevant documentation is available.","Inspect the range of dates shown. A selected start point can change the impression a chart creates. Past results describe the measured period; they do not establish what the next period will bring."],note:"A blank or unavailable field is not zero. Preserve the distinction when building your own comparison table."},{id:"cost-and-limits",title:"Keep the missing pieces visible",paragraphs:["A headline fund charge may not describe every cost of owning the investment through a particular account. Identify the scope of each quoted charge and any additional dealing or account costs.","Finish with a short record of what the factsheet answers and what it does not. Full holdings, complete terms or more detailed risk explanations may require other documents. The goal is a defensible reading, not a ranked list of funds."],bullets:["Identity and share class confirmed","Objective and relevant benchmark understood","Dates and return measure recorded","Cost scope identified","Missing information carried forward"]}],sources:[{label:"MoneyHelper \u2014 Types of investments (fund costs and documents)",url:"https://www.moneyhelper.org.uk/en/savings/investing/popular-investments-at-a-glance",accessed:"23 October 2026"},{label:"FCA \u2014 Understanding price graphs",url:"https://www.fca.org.uk/investsmart/understanding-price-graphs",accessed:"23 October 2026"}]},{id:"portfolio-review-questions",title:"Review a portfolio without making a prediction",dek:"A useful review can examine structure, evidence and change without producing a trading call.",section:"portfolio",type:"article",minutes:4,date:"2026-10-23",tags:["portfolio","diversification","risk","evidence"],related:["diversification","portfolio-overlap","investment-time-horizon"],keyTakeaway:"A portfolio review is stronger when it separates measured exposures from assumptions and unresolved questions.",sections:[{id:"purpose",title:"Write down what the collection is for",paragraphs:["A collection of holdings is easier to examine when its intended purpose is stated. The purpose supplies context; it does not prove the current portfolio is suitable.","For an educational review, keep the description separate from any proposed change. You can identify concentration, cost or missing information without deciding that a particular holding should be bought or sold."]},{id:"exposures",title:"Map the exposures",paragraphs:["Start with the size of each holding relative to the whole. Then look through funds where the data permits. A small direct position can be accompanied by indirect exposure inside several other holdings.","An exposure map may group holdings by underlying company, asset type, region or another relevant characteristic. Each grouping answers a different question, so label its method and limitations rather than treating it as a universal risk score."]},{id:"change",title:"Distinguish change from explanation",paragraphs:["If weights have changed since an earlier review, identify the cause before interpreting the outcome. Market movements, deposits, withdrawals and portfolio transactions can all alter the percentages.","A change in weight does not by itself establish that the original reasoning was right or wrong. It tells you where to look next. Comparing consistent dates and definitions is more useful than inventing a narrative around the latest balance."],keyIdea:"Describe what changed first. Explain it only as far as the evidence allows."},{id:"review-record",title:"Leave a clear record",paragraphs:["A short review can end with an evidence log rather than a prediction. Record the data date, the main concentrations, the cost categories included and the questions still unresolved.","This makes the next review easier to compare. It also keeps uncertainty visible when information is incomplete. A review of structure is an educational exercise; personalised allocation decisions require additional context."],bullets:["What is measured directly?","What depends on reported fund holdings?","Which dates and definitions differ?","Which changes need explanation?","What cannot be concluded from this snapshot?"]}],sources:[{label:"FCA \u2014 Diversification (background concept)",url:"https://www.fca.org.uk/investsmart/diversification",accessed:"23 October 2026"}]},{id:"reading-a-market-story",title:"A price moved. The explanation is less certain.",dek:"Read market coverage in three layers: observation, interpretation and what remains unknown.",section:"markets",type:"article",minutes:4,date:"2026-10-23",tags:["markets","evidence","risk"],related:["shares","risk-and-return","reading-a-fund-factsheet","profit-cash"],keyTakeaway:"A market move can be observed precisely even when its cause cannot be isolated with the same confidence.",sections:[{id:"observation",title:"Establish the observation",paragraphs:["Begin with the asset or index, the measurement period, the units and the data source. A daily move, a change since a selected date and a return including income are different observations.","A screenshot can hide these details. The visible line may be accurate for its chosen window while providing too little context for the claim attached to it. Recovering the measurement is the first job."]},{id:"interpretation",title:"Separate the proposed explanation",paragraphs:["A headline often connects a price movement with a recent event. That connection may be plausible, but events can overlap and prices can reflect expectations formed earlier. Timing alone does not establish one exclusive cause.","Ask what evidence supports the explanation and whether alternative mechanisms remain possible. A report can still be useful when it describes uncertainty honestly. Precision about the observation does not require false precision about the cause."]},{id:"chart",title:"Inspect the frame around the chart",paragraphs:["Changing the start date or vertical scale can alter the visual emphasis without changing the underlying observations. A selected example can therefore be informative and incomplete at the same time.","Check whether the article discusses a price, a yield, an index level or an investor\u2019s return. These quantities can be related without being interchangeable. A number with a clear label is more useful than an impressive-looking line."],note:"A historical chart is evidence about its recorded period. It is not a map of the next price movement."},{id:"unknowns",title:"Keep an uncertainty column",paragraphs:["A simple reading note can have three headings: observed, interpreted and unresolved. Under the first, put verifiable measurements. Under the second, put explanations and their supporting evidence. Under the third, put the questions the available information cannot answer.","This habit creates a calmer way to read markets. It allows an explanation to remain provisional and avoids turning every story into a trading decision."],keyIdea:"Acknowledge the difference between a measured change and an explanation of that change."}],sources:[{label:"FCA \u2014 Understanding price graphs",url:"https://www.fca.org.uk/investsmart/understanding-price-graphs",accessed:"23 October 2026"}]}],researchNotes:[{id:"profit-cash",title:"The business made a profit. Where is the cash?",dek:"Ten fictional invoices show how payment timing can separate a profit from the cash moving through a business.",section:"research",type:"research-note",minutes:5,date:"2026-03-12",tags:["company-research","cash-flow","financial-statements"],related:["shares","fund-fees","reading-a-fund-factsheet"],keyTakeaway:"Recognising a sale and receiving its payment can happen at different times. A bridge explains the difference between profit and cash movement.",disclosure:"My holdings and conflicts: awaiting confirmation from [Author name]. Alder Workshop is fictional and this note concerns no real security. The author\u2019s actual holdings, compensation and affiliations have not been supplied; none is asserted here.",method:"Fixed fictional example, independent of any interactive calculator\u2019s current settings. Alder Workshop recognises ten completed invoices of \xA310 each: revenue \xA3100. Expenses of \xA370 are recognised and paid in the same period, giving profit of \xA330. Six invoices are paid, so customer receipts are \xA360 and the other \xA340 remains in receivables. With no opening receivables, the increase is \xA340. Cash movement is \xA360 \u2212 \xA370 = \u2212\xA310, also reconciled as profit \xA330 \u2212 receivables increase \xA340 = \u2212\xA310. Sufficient opening cash is assumed. There are no changes in inventory or operating payables; taxes, capital expenditure and financing are excluded. The cash movement is not the closing cash balance. This is not a complete set of financial statements or a claim of accounting-framework compliance.",sections:[{id:"question",title:"A useful discrepancy",paragraphs:["Fictional Alder Workshop completes ten orders and recognises ten invoices of \xA310 each. Revenue is \xA3100. It recognises and pays \xA370 of expenses during the same illustrative period, so the profit is \xA330.","Only six invoices have been paid by the period end. The workshop has received \xA360 and paid out \xA370: a \xA310 cash outflow. These invented figures define a fixed worked example, not company results or a judgement about business quality."]},{id:"timing",title:"The sale and the payment are different events",paragraphs:["The four unpaid invoices total \xA340. In this simplified case, they remain as receivables: amounts owed by customers. The exercise assumes the sales qualify for recognition in the period even though some cash has not arrived.","That timing difference is enough to explain why profit and cash movement diverge here. It does not mean the customers will never pay, nor does it establish that collection will be easy. Those would require additional evidence."],note:"A cash movement covers a period. A closing cash balance is a point-in-time amount. Sufficient opening cash is assumed, so the \xA310 outflow does not imply a negative closing balance."},{id:"bridge",title:"Reconcile the two views",paragraphs:["Start with \xA330 of profit and subtract the \xA340 increase in receivables. The result is a \xA310 cash outflow. The direct calculation gives the same answer: \xA360 received from customers less \xA370 paid for expenses.","This bridge works because the assumptions are deliberately narrow. There are no opening receivables and no inventory or operating-payables changes. Tax, capital expenditure and financing are left outside the example."],keyIdea:"\xA330 profit \u2212 \xA340 increase in receivables = \u2212\xA310 cash movement."},{id:"context",title:"Place the example in a wider statement",paragraphs:["The IFRS Foundation\u2019s overview of IAS 7 distinguishes cash flows from operating, investing and financing activities. That broader structure helps organise the movements a real business needs to explain.","Our workshop illustrates only the stated receipts and payments. It does not show a complete cash-flow statement or tell us the ending cash balance. Adding an opening balance would allow that balance to be calculated under the same fixed assumptions."]},{id:"limits",title:"Keep the conclusion proportionate",paragraphs:["The difference is reconciled; the business is not assessed. A real note would examine payment terms, collection history, the age of receivables and whether the period is representative.","Neither profit nor cash movement is the entire story. The useful result is a method: identify what was recognised, identify what was paid, and explain the timing difference before reaching for a conclusion."]}],sources:[{label:"IFRS Foundation \u2014 IAS 7 Statement of Cash Flows",url:"https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/",accessed:"23 October 2026"}]},{id:"fund-fees",title:"The quiet weight of an annual fee",dek:"Make the timing explicit, repeat the calculation and distinguish fees paid from the ending-value gap.",section:"research",type:"research-note",minutes:5,date:"2026-06-18",tags:["fees","compounding","funds"],related:["compounding","funds","reading-a-fund-factsheet"],keyTakeaway:"A fee changes the amount left for later compounding. The difference between two ending balances is not simply the sum of fee payments.",disclosure:"My holdings and conflicts: awaiting confirmation from [Author name]. This note compares hypothetical mathematical paths, not real funds or securities. Actual holdings, compensation and affiliations have not been supplied; none is asserted here.",method:"Original hypothetical model. Starting amount P = \xA310,000; annual gross rate r = 5%; annual fee f = 0.75%; horizon n = 40 whole years. Each fee is charged after that year\u2019s gross growth. No-fee value = P \xD7 (1 + r)^n. After-fee value = P \xD7 [(1 + r) \xD7 (1 \u2212 f)]^n. No contributions, withdrawals, tax, inflation or other costs. Default ending values are about \xA370,399.89 and \xA352,094.58 (rounded to the nearest penny). Their difference is about \xA318,305.30. These inputs are chosen for explanation, not as forecasts or typical market terms.",sections:[{id:"isolate",title:"Isolate one mechanism",paragraphs:["Consider two hypothetical balances beginning at \xA310,000. Both use a fixed 5% annual gross growth assumption. One has no fee; the other deducts 0.75% from the post-growth balance at each year end.","These are invented paths, not products available to buy. Holding the gross rate steady makes the fee\u2019s arithmetic visible. It does not imply that real investments produce a smooth or certain return."]},{id:"first-year",title:"Inspect the first year",paragraphs:["Without the fee, the first year ends at \xA310,500. In the other path, 0.75% of \xA310,500 is \xA378.75, leaving \xA310,421.25. The next year starts with that smaller amount.","Writing out one period is useful because it reveals the charging convention. Applying the fee at another time, using a fixed cash charge or including contributions would require a different model."],keyIdea:"Timing is part of the formula, not a footnote to it."},{id:"repetition",title:"Repeat the same calculation",paragraphs:["After forty repetitions, the stated model gives approximately \xA370,400 without the fee and \xA352,095 after it. The ending-value gap is about \xA318,305. These are calculated results of the chosen assumptions, not observed investment statistics.","The gap combines fee deductions with the compounding affected by those deductions. Adding the actual fees charged each year would answer a different question. The difference should therefore be described as an ending-value gap, not total fees paid."],note:"A percentage gap is meaningful only when the no-fee comparison balance is greater than zero."},{id:"comparison",title:"Keep product comparisons separate",paragraphs:["The model isolates one charge under identical gross assumptions. It cannot show whether a real fund\u2019s strategy, services, restrictions or risks justify its terms.","Costs can also exist outside the fund\u2019s quoted ongoing charge. A research comparison needs a defined scope: fund charges, account costs, dealing costs and any other included categories. One percentage should not silently stand in for all of them."]},{id:"limits",title:"Read the edges of the model",paragraphs:["There are no contributions, withdrawals, taxes or inflation adjustments. The pounds are nominal, and the gross rate does not vary. The forty-year horizon provides repetitions, not evidence that the assumed path is likely.","The teaching result is a mechanism: a deduction reduces both the current balance and the base used later. Understanding that mechanism can improve a question about fees without producing a recommendation about any investment."]}],sources:[{label:"MoneyHelper \u2014 Key information and cooling off periods (charges in fund documents; this note uses its own model)",url:"https://www.moneyhelper.org.uk/en/savings/investing/key-facts-documents-and-cooling-off-periods-what-you-need-to-know",accessed:"23 October 2026"},{label:"MoneyHelper \u2014 Types of investments (different cost layers)",url:"https://www.moneyhelper.org.uk/en/savings/investing/popular-investments-at-a-glance",accessed:"23 October 2026"}]},{id:"portfolio-overlap",title:"Two funds, one repeated exposure",dek:"A look-through calculation reveals what a list of holdings can conceal.",section:"research",type:"research-note",minutes:5,date:"2026-10-23",tags:["diversification","portfolio","funds"],related:["diversification","portfolio-review-questions","etfs"],keyTakeaway:"Multiply each fund\u2019s portfolio weight by its underlying holding weight, then add the exposures that refer to the same thing.",disclosure:"My holdings and conflicts: awaiting confirmation from [Author name]. Fund A, Fund B and Cedar Components are wholly fictional teaching labels. They refer to no real fund or security. Actual author holdings, compensation and affiliations have not been supplied; none is asserted here.",method:"Original fictional snapshot. The illustrative portfolio holds 60% in fictional Fund A and 40% in fictional Fund B. Fictional Cedar Components is 10% of Fund A and 20% of Fund B. Look-through portfolio exposure is (0.60 \xD7 0.10) + (0.40 \xD7 0.20) = 0.14, or 14%. This is a simplified weight calculation, not a correlation estimate, risk score or suggested allocation. All weights are measured at the same assumed moment; no leverage, derivatives, cash flows or missing holdings are included.",sections:[{id:"names",title:"A list of names is not the exposure map",paragraphs:["Imagine an entirely fictional portfolio containing 60% Fund A and 40% Fund B. The two names occupy separate rows, which can create an impression of separation.","Now look inside. Fictional Cedar Components represents 10% of Fund A and 20% of Fund B. Owning both funds combines those underlying exposures. Every name and weight in this note is invented for teaching; the allocation is not a recommendation."]},{id:"arithmetic",title:"Multiply before adding",paragraphs:["Fund A contributes 60% \xD7 10% = 6% of the total portfolio to Cedar Components. Fund B contributes 40% \xD7 20% = 8%. Adding those contributions gives 14% of the portfolio in the same fictional underlying company.","Adding 10% and 20% directly would ignore the sizes of the two fund positions. The look-through calculation uses both layers of weights so that the resulting percentage refers to the whole portfolio."],keyIdea:"A holding\u2019s weight inside a fund is not automatically its weight in your portfolio."},{id:"identity",title:"Make sure the rows mean the same thing",paragraphs:["A real calculation would require reliable identification of the underlying securities and consistent reporting dates. Similar names do not necessarily identify the same instrument, while different labels can conceal the same exposure.","Incomplete holdings lists create a second problem. If only the largest positions are disclosed, an omitted company cannot be treated as a zero. Preserve an \u2018unknown\u2019 category instead of manufacturing precision."],note:"The arithmetic can be correct while the source data is incomplete. Both the method and the evidence need to be inspectable."},{id:"risk",title:"Overlap is one question, not every question",paragraphs:["Company overlap describes repeated direct or indirect exposure. It does not measure all shared economic risks. Two different companies might depend on similar customers, inputs or financing conditions.","Likewise, the 14% result does not predict future losses or tell us whether the concentration is appropriate for someone. It answers one tightly defined question about the fictional snapshot."]},{id:"record",title:"Keep the research record usable",paragraphs:["Record the portfolio weights, underlying weights, identity matching, source dates and excluded holdings. A reader should be able to reproduce the total and see where the evidence stops.","The broader lesson is to look through labels. More holdings can add new exposures, repeat existing ones or do both. A transparent map makes that distinction visible without turning it into a fund ranking or a trading instruction."]}],sources:[{label:"FCA InvestSmart \u2014 Diversification (background on spreading, and concentrating, exposure)",url:"https://www.fca.org.uk/investsmart/diversification",accessed:"23 October 2026"}]}],tags:[{id:"basics",label:"The basics"},{id:"shares",label:"Shares"},{id:"bonds",label:"Bonds"},{id:"etfs",label:"ETFs"},{id:"funds",label:"Funds"},{id:"risk",label:"Risk"},{id:"diversification",label:"Diversification"},{id:"compounding",label:"Compounding"},{id:"fees",label:"Fees & costs"},{id:"company-research",label:"Company research"},{id:"cash-flow",label:"Cash flow"},{id:"financial-statements",label:"Financial statements"},{id:"portfolio",label:"Portfolio construction"},{id:"markets",label:"Markets"},{id:"time-horizon",label:"Time horizon"},{id:"evidence",label:"Reading the evidence"},{id:"uk-accounts",label:"UK accounts & protection"}]},window.LEDGER_UI={home:{eyebrow:"Independent finance education",title:["Understand how.","Then ask why."],dek:"Investing, portfolios and company research, explained from the first principles. A place to build understanding, one good question at a time.",meta:"One author. Visible methods. Space to think.",manual:{top:"FIELD GUIDE / 01",title:"Begin with a question.",bottom:"Eight connected lessons",caption:"Start with the foundations. Return whenever you need a clearer explanation."},footer:["For the curious beginner and the careful reader.","Education \xB7 Research \xB7 Practical understanding"],featuredTitle:"Profit is a record. Cash is a movement.",featuredDek:"A business can record a profit before its customers have paid. Follow one fictional workshop through the difference, then test the mechanism yourself.",seriesTitle:"Keep the foundations close.",seriesDek:"Three reading paths, designed to be opened and returned to.",latestTitle:"Open the next question.",questions:[{label:"Cash flow",query:"cash flow"},{label:"Fund fees",query:"fees"},{label:"Diversification",query:"diversification"},{label:"Bonds",query:"bonds"}],series:[{number:"01",title:"The first principles.",path:"/start-here",label:"FOUNDATIONS",detail:"8 short lessons",description:"Shares, bonds, funds and the vocabulary that connects them."},{number:"02",title:"The whole portfolio.",path:"/portfolio",label:"PORTFOLIO",detail:"Look through the holdings",description:"Read the collection as a system, with risk and overlap in view."},{number:"03",title:"Read the evidence.",path:"/research",label:"RESEARCH",detail:"Methods made visible",description:"Worked notes with assumptions, sources and a proportionate conclusion."}]},newsletter:{eyebrow:"The reading list",title:"The next question, in your inbox.",intro:"New explanations and research notes, with enough space to think between them.",notice:"This form checks an email address only. Nothing is sent, saved or subscribed.",confirmationTitle:"Thanks for reading along.",confirmationBody:"Your email passed the format check. Nothing was sent or stored, and no subscription was created. You can carry on exploring the publication.",tracks:[{id:"foundations",label:"Foundations",detail:"New lessons and plain-English guides"},{id:"research",label:"Research notes",detail:"Worked methods with sources and limits"},{id:"markets",label:"Markets in context",detail:"What changed, and the explanations offered"}],directConfirmationBody:"You have reached the confirmation page. This example does not create a subscription or retain an email address."},footer:{description:"Independent education on investing, portfolios and markets.",disclaimer:"The Intrinsic Review provides general financial education and research explanations. It does not provide personal recommendations, stock tips, buy or sell calls, ratings or target prices. Investments involve risk, including loss of capital. Hypothetical examples explain a method and do not establish what is suitable for an individual.",draft:"Design draft, placeholder content"},about:{intro:"The Intrinsic Review is a working name for an independent publication by [Author name]. Its purpose is to make the mechanisms of investing, portfolios and company research easier to understand.",approach:"The writing begins with a question and follows the reasoning. A beginner should be able to find a clear starting point. An experienced reader should be able to inspect the assumptions and see where the evidence stops.",authorBio:"[Author biography \u2014 to be supplied and verified before publication.]",credential:"[Credential \u2014 to be supplied and verified.]",standards:[{title:"Show the working",body:"A numerical example carries its inputs, method, source date and limits. Where a chart appears, the underlying numbers are available in a table."},{title:"Separate explanation from recommendation",body:"Articles explain instruments, mechanisms and research methods. They do not make stock tips, buy or sell calls, ratings, target prices or personal recommendations."},{title:"Keep conflicts close to the work",body:"Research notes carry a holdings and conflicts box. Author-specific disclosures remain marked as awaiting confirmation until the author supplies and verifies them."},{title:"Make uncertainty readable",body:"An observation, an interpretation and an unresolved question are different things. Research should preserve those distinctions and keep its conclusion proportionate
